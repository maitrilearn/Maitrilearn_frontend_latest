<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaitriLearn — AI Teacher Board</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060910;
      --panel: #0d1117;
      --card: #111827;
      --border: #1f2937;
      --accent: #22d3ee;
      --accent2: #a78bfa;
      --green: #4ade80;
      --yellow: #fbbf24;
      --red: #f87171;
      --orange: #fb923c;
      --text: #f9fafb;
      --muted: #6b7280;
      --board: #0a0f1e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOPBAR ── */
    .topbar {
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .topbar-logo {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 2px;
      text-decoration: none;
    }
    .topbar-logo span { color: var(--muted); }
    .topbar-divider { width: 1px; height: 20px; background: var(--border); }
    .topbar-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
    .status-pill {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      background: #052e16;
      color: var(--green);
      border: 1px solid #166534;
      transition: all .3s;
    }
    .status-pill.loading { background: #0c1a2e; color: var(--accent); border-color: #1e3a5f; animation: breathe 1.5s infinite; }
    .status-pill.teaching { background: #1e0a3c; color: var(--accent2); border-color: #4c1d95; }
    .status-pill.error { background: #1c0a0a; color: var(--red); border-color: #7f1d1d; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── MAIN ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Avatar section */
    .avatar-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .avatar-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 40% 35%, #1e3a5f, #0d1117);
    }
    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--accent), var(--accent2), var(--accent));
      z-index: -1;
      opacity: 0;
      transition: opacity .3s;
    }
    .avatar-ring.talking::before { opacity: 1; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar-svg { width: 64px; height: 64px; }

    .speech-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      width: 100%;
      min-height: 50px;
      position: relative;
    }
    .speech-box::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-bottom-color: var(--border);
    }
    .tutor-name {
      font-size: 11px;
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      letter-spacing: 1px;
    }

    /* Controls */
    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .topic-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border .2s;
    }
    .topic-input:focus { border-color: var(--accent); }
    .topic-input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .5px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #060910;
      box-shadow: 0 0 20px rgba(34,211,238,.2);
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 0 30px rgba(34,211,238,.4); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .3; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-ghost:disabled { opacity: .3; cursor: not-allowed; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    /* Step list */
    .steps-section {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .steps-label {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .step-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      transition: all .25s;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .step-row.active {
      background: rgba(34,211,238,.08);
      border-color: rgba(34,211,238,.2);
      color: var(--accent);
      font-weight: 600;
    }
    .step-row.done { color: var(--green); }
    .step-icon { font-size: 14px; flex-shrink: 0; }
    .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .step-row.active .step-dot { animation: breathe 1s infinite; box-shadow: 0 0 6px var(--accent); }

    /* Voice toggle */
    .voice-row {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .voice-row input { accent-color: var(--accent); }

    /* ── BOARD ── */
    .board-area {
      flex: 1;
      position: relative;
      background: var(--board);
      overflow: hidden;
    }

    /* Grid background */
    .board-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(34,211,238,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    #board-content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Idle overlay */
    .idle-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
      transition: opacity .4s;
    }
    .idle-overlay.hidden { opacity: 0; }
    .idle-glyph {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      background: var(--card);
    }
    .idle-text { font-size: 15px; color: var(--muted); text-align: center; line-height: 1.8; }
    .idle-text strong { color: var(--accent); font-weight: 600; }

    /* ── BOARD STEP PANELS ── */
    .step-panel {
      position: absolute;
      inset: 0;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: none;
      pointer-events: all;
      animation: stepIn .35s ease;
    }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .step-panel.visible { opacity: 1; }

    /* Title step */
    .title-step {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
    }
    .title-subject-tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      padding: 6px 16px;
      border: 1px solid rgba(34,211,238,.3);
      border-radius: 20px;
      background: rgba(34,211,238,.05);
    }
    .title-main {
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .title-bar {
      width: 80px; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
    }
    .title-sub { font-size: 16px; color: var(--muted); max-width: 500px; line-height: 1.6; }

    /* Text step */
    .text-step { gap: 24px; }
    .step-heading {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-heading::before {
      content: '';
      width: 4px; height: 28px;
      background: linear-gradient(var(--accent), var(--accent2));
      border-radius: 2px;
      flex-shrink: 0;
    }
    .step-body {
      font-size: 17px;
      line-height: 1.8;
      color: #d1d5db;
      max-width: 780px;
    }
    .step-body .highlight {
      color: var(--accent);
      font-weight: 600;
    }

    /* Flowchart */
    .flowchart-step { gap: 28px; }
    .flow-nodes {
      display: flex;
      align-items: center;
      gap: 0;
      flex-wrap: wrap;
      gap: 0;
    }
    .flow-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .flow-node.visible { opacity: 1; transform: translateX(0); }
    .flow-node-box {
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-width: 120px;
      border: 1px solid;
      white-space: nowrap;
    }
    .flow-arrow {
      display: flex;
      align-items: center;
      padding: 0 8px;
      color: var(--muted);
      font-size: 20px;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .flow-arrow.visible { opacity: 1; }
    .flow-num {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* Diagram */
    .diagram-step { gap: 24px; }
    .diagram-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      flex: 1;
    }
    .diagram-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .diagram-card.visible { opacity: 1; transform: translateY(0); }
    .diagram-card-num {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
    }
    .diagram-card-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .diagram-card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Graph */
    .graph-step { gap: 20px; }
    .graph-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }
    .graph-axis-label {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      height: 200px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      border-left: 1px solid var(--border);
    }
    .bar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .bar-value {
      font-size: 12px;
      font-family: 'Space Mono', monospace;
      color: var(--text);
      opacity: 0;
      transition: opacity .3s;
    }
    .bar-value.visible { opacity: 1; }
    .bar-fill {
      width: 100%;
      border-radius: 6px 6px 0 0;
      height: 0;
      transition: height .8s cubic-bezier(.34,1.56,.64,1);
      max-width: 80px;
    }
    .bar-label {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      line-height: 1.3;
    }

    /* Keypoints */
    .keypoints-step { gap: 20px; }
    .keypoints-list { display: flex; flex-direction: column; gap: 12px; }
    .keypoint-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      opacity: 0;
      transform: translateX(-16px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .keypoint-row.visible { opacity: 1; transform: translateX(0); }
    .keypoint-num {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .keypoint-text { font-size: 15px; color: var(--text); line-height: 1.5; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      body { overflow: auto; height: auto; }
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a href="index.html" class="topbar-logo">MAITRI<span>LEARN</span></a>
  <div class="topbar-divider"></div>
  <div class="topbar-title">🏫 AI Teacher Board</div>
  <div class="status-pill" id="statusPill">READY</div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Avatar -->
    <div class="avatar-section">
      <div class="avatar-ring" id="avatarRing">
        <svg class="avatar-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="20" r="14" fill="#1e3a5f"/>
          <ellipse cx="32" cy="22" rx="10" ry="11" fill="#f9c784"/>
          <rect x="22" y="30" width="20" height="24" rx="6" fill="#1d4ed8"/>
          <ellipse cx="32" cy="17" rx="10" ry="6" fill="#3b1f0e"/>
          <circle cx="27" cy="21" r="2.5" fill="white"/>
          <circle cx="37" cy="21" r="2.5" fill="white"/>
          <circle cx="27.8" cy="21.5" r="1.2" fill="#1e293b" id="eyeL"/>
          <circle cx="37.8" cy="21.5" r="1.2" fill="#1e293b" id="eyeR"/>
          <path id="mouth" d="M28 27 Q32 30 36 27" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <circle cx="27" cy="21" r="3.5" fill="none" stroke="#374151" stroke-width="1.2"/>
          <circle cx="37" cy="21" r="3.5" fill="none" stroke="#374151" stroke-width="1.2"/>
          <line x1="30.5" y1="21" x2="33.5" y2="21" stroke="#374151" stroke-width="1.2"/>
          <rect x="30" y="30" width="4" height="8" fill="white"/>
          <polygon points="29,30 35,30 34,36 30,36" fill="#dc2626"/>
        </svg>
      </div>
      <div class="tutor-name" id="tutorName">DR. MAITHRI</div>
      <div class="speech-box">
        <span id="speechText">Hello! Enter a topic and I'll teach you with visuals! 👋</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input class="topic-input" id="topicInput" placeholder="e.g. Docker, Kubernetes, CI/CD...">
      <button class="btn btn-primary" id="startBtn" onclick="startLesson()">▶ Start Lesson</button>
      <div class="btn-row">
        <button class="btn btn-ghost" id="pauseBtn" onclick="togglePause()" disabled>⏸ Pause</button>
        <button class="btn btn-ghost" onclick="clearLesson()">✕ Clear</button>
      </div>
    </div>

    <!-- Steps -->
    <div class="steps-section">
      <div class="steps-label">Lesson Steps</div>
      <div id="stepList"></div>
    </div>

    <!-- Voice -->
    <div class="voice-row">
      <input type="checkbox" id="voiceToggle" checked>
      <label for="voiceToggle">🔊 Voice narration (local only)</label>
    </div>

  </aside>

  <!-- BOARD -->
  <main class="board-area">
    <div id="board-content"></div>
    <div class="idle-overlay" id="idleOverlay">
      <div class="idle-glyph">🖊️</div>
      <div class="idle-text">Enter a topic and press <strong>Start Lesson</strong><br>to begin your AI-powered visual lesson</div>
    </div>
  </main>

</div>

<script src="js/config.js"></script>
<script src="js/whiteboard.js"></script>
</body>
</html>
